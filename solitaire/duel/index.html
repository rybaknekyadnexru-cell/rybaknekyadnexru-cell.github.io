<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="description" content="A friend challenged you to a duel in Solitaire Gallery. Open the link on Android with the game installed, or get the game on Google Play">
<title>Solitaire Gallery duel</title>
<!--
  Solitaire Gallery duel landing (ADR-0091 of the game). A challenge is shared as
  https://rybaknekyadnexru-cell.github.io/solitaire/duel/#<payload>. With the game installed Android opens it through
  the App Link (intent-filter autoVerify, host + path prefix /solitaire/duel, statement in /.well-known/assetlinks.json);
  everyone else lands here. The payload after # stays in the address bar: this page never reads, sends or stores it.
  No trackers, no third-party scripts. The only script below picks the text language from the browser language.
-->
<style>
  :root { --bg: #fbf8f2; --fg: #231f1a; --muted: #6a6258; --accent: #8a5a1c; --btn-fg: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16130f; --fg: #f1ebe0; --muted: #b3a999; --accent: #e0b25c; --btn-fg: #1a1409; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg);
         font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; }
  main { width: 100%; max-width: 30rem; text-align: center; }
  .eyebrow { margin: 0 0 .5rem; color: var(--accent); font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; }
  h1 { margin: 0 0 .75rem; font-size: 1.7rem; line-height: 1.25; }
  p { margin: 0 0 1.5rem; color: var(--muted); }
  .btn { display: inline-block; min-height: 48px; padding: 12px 28px; border-radius: 999px; background: var(--accent); color: var(--btn-fg);
         font-weight: 600; text-decoration: none; }
  .btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Solitaire Gallery</p>
  <h1 id="title">You've been challenged to a duel in Solitaire Gallery</h1>
  <p id="text">If the game is installed, this link opens it on Android. If not, install it from Google Play and open the link again</p>
  <a class="btn" id="play" href="https://play.google.com/store/apps/details?id=com.nrgames.solitaire" rel="noopener">Get it on Google Play</a>
</main>
<script>
(function () {
  var T = {
    "ru": ["Вас вызвали на дуэль в Solitaire Gallery", "Если игра установлена, на Android эта ссылка откроет её. Если нет, установите игру из Google Play и откройте ссылку снова", "Установить из Google Play"],
    "ja": ["Solitaire Gallery で決闘を挑まれました", "ゲームがインストールされていれば、Android でこのリンクからゲームが開きます。未インストールの場合は Google Play から入手し、もう一度リンクを開いてください", "Google Play で入手"],
    "pt-BR": ["Você foi desafiado para um duelo no Solitaire Gallery", "Se o jogo estiver instalado, este link o abre no Android. Se não, instale pelo Google Play e abra o link de novo", "Baixar no Google Play"],
    "es": ["Le han retado a un duelo en Solitaire Gallery", "Si el juego está instalado, este enlace lo abre en Android. Si no, instálelo desde Google Play y vuelva a abrir el enlace", "Descargar en Google Play"],
    "de": ["Sie wurden in Solitaire Gallery zum Duell herausgefordert", "Ist das Spiel installiert, öffnet dieser Link es auf Android. Andernfalls installieren Sie es über Google Play und öffnen Sie den Link erneut", "Bei Google Play laden"],
    "ko": ["Solitaire Gallery에서 결투 신청을 받았습니다", "게임이 설치되어 있으면 Android에서 이 링크로 게임이 열립니다. 없다면 Google Play에서 설치한 뒤 링크를 다시 여세요", "Google Play에서 받기"],
    "fr": ["Vous avez été défié en duel dans Solitaire Gallery", "Si le jeu est installé, ce lien l'ouvre sur Android. Sinon, installez-le depuis Google Play et rouvrez le lien", "Télécharger sur Google Play"],
    "zh-TW": ["有人在 Solitaire Gallery 向你發起決鬥", "如果已安裝遊戲，在 Android 上此連結會直接開啟遊戲。尚未安裝的話，請先從 Google Play 安裝，再重新開啟連結", "前往 Google Play 下載"],
    "zh-CN": ["有人在 Solitaire Gallery 向你发起决斗", "如果已安装游戏，在 Android 上此链接会直接打开游戏。尚未安装的话，请先从 Google Play 安装，再重新打开链接", "前往 Google Play 下载"],
    "id": ["Anda ditantang duel di Solitaire Gallery", "Jika gim sudah terpasang, tautan ini membukanya di Android. Jika belum, pasang dari Google Play lalu buka tautan lagi", "Dapatkan di Google Play"],
    "vi": ["Bạn được thách đấu trong Solitaire Gallery", "Nếu đã cài trò chơi, liên kết này sẽ mở nó trên Android. Nếu chưa, hãy cài từ Google Play rồi mở lại liên kết", "Tải trên Google Play"],
    "tr": ["Solitaire Gallery'de düelloya davet edildiniz", "Oyun yüklüyse bu bağlantı Android'de onu açar. Değilse Google Play'den yükleyip bağlantıyı yeniden açın", "Google Play'den indir"],
    "it": ["Siete stati sfidati a duello in Solitaire Gallery", "Se il gioco è installato, questo link lo apre su Android. Altrimenti installatelo da Google Play e riaprite il link", "Scarica su Google Play"],
    "pl": ["Wyzwano Cię na pojedynek w Solitaire Gallery", "Jeśli gra jest zainstalowana, ten link otworzy ją na Androidzie. Jeśli nie, zainstaluj ją z Google Play i otwórz link ponownie", "Pobierz z Google Play"],
    "hi": ["आपको Solitaire Gallery में द्वंद्व की चुनौती मिली है", "अगर गेम इंस्टॉल है, तो Android पर यह लिंक उसे खोल देगा। अगर नहीं, तो Google Play से इंस्टॉल करें और लिंक फिर से खोलें", "Google Play पर पाएँ"],
    "th": ["คุณถูกท้าดวลใน Solitaire Gallery", "หากติดตั้งเกมแล้ว ลิงก์นี้จะเปิดเกมบน Android หากยังไม่มี ให้ติดตั้งจาก Google Play แล้วเปิดลิงก์อีกครั้ง", "รับบน Google Play"],
    "ar": ["تم تحديك إلى مبارزة في Solitaire Gallery", "إذا كانت اللعبة مثبّتة فسيفتحها هذا الرابط على Android. وإلا ثبّتها من Google Play ثم افتح الرابط مرة أخرى", "احصل عليها من Google Play"]
  };
  var ALIAS = { "in": "id", "pt": "pt-BR", "zh": "zh-CN", "zh-HK": "zh-TW", "zh-MO": "zh-TW", "zh-Hant": "zh-TW", "zh-Hant-TW": "zh-TW", "zh-Hans": "zh-CN" };
  function pick(list) {
    for (var i = 0; i < list.length; i++) {
      var tag = String(list[i] || "");
      var lower = tag.toLowerCase();
      for (var key in T) { if (key.toLowerCase() === lower) return key; }
      for (var a in ALIAS) { if (a.toLowerCase() === lower) return ALIAS[a]; }
      var base = lower.split("-")[0];
      for (var k2 in T) { if (k2.toLowerCase() === base) return k2; }
      for (var a2 in ALIAS) { if (a2.toLowerCase() === base) return ALIAS[a2]; }
      if (base === "en") return null;
    }
    return null;
  }
  try {
    var lang = pick(navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language]);
    if (!lang) return;
    var t = T[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.getElementById("title").textContent = t[0];
    document.getElementById("text").textContent = t[1];
    document.getElementById("play").textContent = t[2];
    document.title = t[0];
  } catch (e) { /* the English text stays */ }
})();
</script>
</body>
</html>
